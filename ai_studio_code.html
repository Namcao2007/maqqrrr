<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Master - Tạo và Quét mã QR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js (Tạo QR) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5-QRCode (Quét QR) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Đảm bảo mã QR tạo ra luôn căn giữa */
        #qrcode img, #qrcode canvas {
            margin: 0 auto;
            border-radius: 8px;
            padding: 10px;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode"></i> QR Master
            </h1>
            <p class="text-indigo-100 text-sm mt-1">Công cụ Tạo và Quét mã QR toàn diện</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-200 bg-gray-50">
            <button onclick="switchTab('generate')" id="tab-generate" class="flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Tạo Mã QR
            </button>
            <button onclick="switchTab('scan')" id="tab-scan" class="flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-camera"></i> Quét Mã QR
            </button>
        </div>

        <!-- Content Area -->
        <div class="p-6">
            
            <!-- TAB 1: TẠO MÃ QR -->
            <div id="content-generate" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nhập đường dẫn (URL) hoặc văn bản:</label>
                    <div class="relative">
                        <input type="text" id="qr-input" placeholder="https://example.com hoặc văn bản..." 
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                        <i class="fa-solid fa-link absolute left-3.5 top-3.5 text-gray-400"></i>
                    </div>
                </div>

                <button onclick="generateQR()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> Tạo Mã QR Ngay
                </button>

                <!-- Khu vực hiển thị QR -->
                <div id="qr-result-container" class="hidden flex-col items-center justify-center pt-4 border-t border-gray-100">
                    <div id="qrcode" class="mb-4"></div>
                    <button onclick="downloadQR()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 px-6 rounded-xl shadow-md shadow-emerald-100 transition-all flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-download"></i> Tải Ảnh QR Về Máy
                    </button>
                </div>
            </div>

            <!-- TAB 2: QUÉT MÃ QR -->
            <div id="content-scan" class="hidden space-y-5">
                
                <!-- Lựa chọn phương thức quét -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="toggleCamera()" id="btn-camera" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-3 px-4 rounded-xl border border-indigo-200 transition-all flex flex-col items-center justify-center gap-1">
                        <i class="fa-solid fa-video text-xl mb-1"></i>
                        <span class="text-xs" id="camera-btn-text">Dùng Camera</span>
                    </button>

                    <label for="qr-input-file" class="cursor-pointer bg-purple-50 hover:bg-purple-100 text-purple-700 font-medium py-3 px-4 rounded-xl border border-purple-200 transition-all flex flex-col items-center justify-center gap-1">
                        <i class="fa-solid fa-image text-xl mb-1"></i>
                        <span class="text-xs">Tải Ảnh Lên</span>
                        <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanFromFile(event)">
                    </label>
                </div>

                <!-- Khu vực hiển thị Camera -->
                <div id="reader-container" class="hidden rounded-2xl overflow-hidden border-2 border-dashed border-gray-300 bg-gray-50 relative">
                    <div id="reader" class="w-full"></div>
                </div>

                <!-- Khu vực hiển thị kết quả Quét -->
                <div id="scan-result-container" class="hidden bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Kết quả giải mã:</h3>
                    <div class="bg-white p-3 rounded-lg border border-gray-100 break-all text-gray-800 font-medium text-sm mb-3" id="scan-result-text">
                        <!-- Kết quả sẽ hiện ở đây -->
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyResult()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-lg text-xs font-medium transition-all flex items-center justify-center gap-1">
                            <i class="fa-regular fa-copy"></i> Sao chép
                        </button>
                        <a id="btn-open-url" href="#" target="_blank" class="hidden flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-xs font-medium transition-all items-center justify-center gap-1">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở liên kết
                        </a>
                    </div>
                </div>

            </div>

        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 p-4 text-center text-xs text-gray-400 border-t border-gray-100">
            Xây dựng với HTML5, TailwindCSS & JS
        </div>
    </div>

    <!-- Thông báo Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-msg">Thông báo</span>
    </div>

    <script>
        // --- BIẾN TOÀN CỤC ---
        let qrcodeObj = null;
        let html5QrCode = null;
        let isCameraRunning = false;

        // --- CHUYỂN ĐỔI TAB ---
        function switchTab(tab) {
            const tabGenerate = document.getElementById('tab-generate');
            const tabScan = document.getElementById('tab-scan');
            const contentGenerate = document.getElementById('content-generate');
            const contentScan = document.getElementById('content-scan');

            if (tab === 'generate') {
                tabGenerate.className = "flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition-all flex items-center justify-center gap-2";
                tabScan.className = "flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all flex items-center justify-center gap-2";
                contentGenerate.classList.remove('hidden');
                contentScan.classList.add('hidden');
                stopCamera(); // Tắt camera nếu đang bật
            } else {
                tabScan.className = "flex-1 py-4 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white transition-all flex items-center justify-center gap-2";
                tabGenerate.className = "flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all flex items-center justify-center gap-2";
                contentScan.classList.remove('hidden');
                contentGenerate.classList.add('hidden');
            }
        }

        // --- CHỨC NĂNG 1: TẠO MÃ QR ---
        function generateQR() {
            const input = document.getElementById('qr-input').value.trim();
            const container = document.getElementById('qr-result-container');
            const qrDiv = document.getElementById('qrcode');

            if (!input) {
                showToast("Vui lòng nhập nội dung hoặc đường dẫn!", "error");
                return;
            }

            // Xóa mã QR cũ
            qrDiv.innerHTML = "";
            container.classList.remove('hidden');
            container.classList.add('flex');

            // Tạo mã QR mới
            qrcodeObj = new QRCode(qrDiv, {
                text: input,
                width: 200,
                height: 200,
                colorDark : "#1e1b4b", // Màu xanh đậm (Indigo-950)
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            showToast("Tạo mã QR thành công!");
        }

        function downloadQR() {
            const qrDiv = document.getElementById('qrcode');
            const img = qrDiv.querySelector('img');
            const canvas = qrDiv.querySelector('canvas');
            
            let url = '';
            // Thư viện tạo ra cả canvas và img, lấy nguồn từ cái nào có sẵn
            if (img && img.src) {
                url = img.src;
            } else if (canvas) {
                url = canvas.toDataURL("image/png");
            }

            if (url) {
                const link = document.createElement('a');
                link.download = `QR-${Date.now()}.png`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Đang tải ảnh xuống...");
            }
        }

        // Cho phép ấn Enter để tạo QR
        document.getElementById('qr-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') generateQR();
        });

        // --- CHỨC NĂNG 2: QUÉT MÃ QR ---
        function initScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
        }

        function toggleCamera() {
            if (isCameraRunning) {
                stopCamera();
            } else {
                startCamera();
            }
        }

        function startCamera() {
            initScanner();
            const readerContainer = document.getElementById('reader-container');
            const btnCamera = document.getElementById('btn-camera');
            const btnText = document.getElementById('camera-btn-text');

            readerContainer.classList.remove('hidden');
            
            html5QrCode.start(
                { facingMode: "environment" }, // Ưu tiên camera sau
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText) => {
                    // Quét thành công
                    handleScanSuccess(decodedText);
                    stopCamera(); // Tự động dừng camera sau khi quét được
                },
                (errorMessage) => {
                    // Đang quét nhưng chưa thấy mã (bỏ qua lỗi này)
                }
            ).then(() => {
                isCameraRunning = true;
                btnCamera.classList.replace('bg-indigo-50', 'bg-red-50');
                btnCamera.classList.replace('text-indigo-700', 'text-red-600');
                btnCamera.classList.replace('border-indigo-200', 'border-red-200');
                btnText.innerText = "Tắt Camera";
            }).catch((err) => {
                showToast("Không thể truy cập Camera! Hãy cấp quyền.", "error");
                readerContainer.classList.add('hidden');
            });
        }

        function stopCamera() {
            if (html5QrCode && isCameraRunning) {
                html5QrCode.stop().then(() => {
                    isCameraRunning = false;
                    document.getElementById('reader-container').classList.add('hidden');
                    
                    const btnCamera = document.getElementById('btn-camera');
                    const btnText = document.getElementById('camera-btn-text');
                    btnCamera.classList.replace('bg-red-50', 'bg-indigo-50');
                    btnCamera.classList.replace('text-red-600', 'text-indigo-700');
                    btnCamera.classList.replace('border-red-200', 'border-indigo-200');
                    btnText.innerText = "Dùng Camera";
                }).catch(err => console.error(err));
            }
        }

        function scanFromFile(event) {
            if (event.target.files.length == 0) return;
            
            // Nếu camera đang chạy thì tắt đi
            if (isCameraRunning) stopCamera();
            
            initScanner();
            const imageFile = event.target.files[0];

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                    // Reset input file để có thể chọn lại cùng 1 ảnh
                    event.target.value = ''; 
                    // Ẩn khung hình ảnh do thư viện tự tạo ra
                    document.getElementById('reader').innerHTML = '';
                })
                .catch(err => {
                    showToast("Không tìm thấy mã QR hợp lệ trong ảnh này!", "error");
                    event.target.value = '';
                    document.getElementById('reader').innerHTML = '';
                });
        }

        function handleScanSuccess(decodedText) {
            const resultContainer = document.getElementById('scan-result-container');
            const resultText = document.getElementById('scan-result-text');
            const btnOpenUrl = document.getElementById('btn-open-url');

            resultContainer.classList.remove('hidden');
            resultText.innerText = decodedText;

            // Kiểm tra xem kết quả có phải là URL hợp lệ không
            if (isValidURL(decodedText)) {
                btnOpenUrl.href = decodedText;
                btnOpenUrl.classList.remove('hidden');
                btnOpenUrl.classList.add('flex');
            } else {
                btnOpenUrl.classList.add('hidden');
                btnOpenUrl.classList.remove('flex');
            }

            showToast("Đã giải mã QR thành công!");
            
            // Phát tiếng bíp nhẹ (tùy chọn)
            playBeep();
        }

        // --- TIỆN ÍCH MỞ RỘNG ---
        function copyResult() {
            const text = document.getElementById('scan-result-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast("Đã sao chép vào bộ nhớ tạm!");
            });
        }

        function isValidURL(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');

            toastMsg.innerText = message;
            
            if (type === "error") {
                icon.className = "fa-solid fa-circle-exclamation text-red-400";
            } else {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Tạo âm thanh bíp khi quét thành công bằng Web Audio API (không cần file ngoài)
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                // Bỏ qua nếu trình duyệt chặn tự phát âm thanh
            }
        }
    </script>
</body>
</html>
